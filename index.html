<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Displacement Field Generator</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #111827;
        color: #e5e7eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #111827;
      }

      main {
        display: grid;
        grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
        gap: 20px;
        min-height: 100vh;
        padding: 20px;
      }

      aside,
      section {
        min-width: 0;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: 0;
      }

      #controls {
        display: grid;
        gap: 12px;
        max-height: calc(100vh - 76px);
        overflow: auto;
        padding-right: 6px;
      }

      .control-group {
        display: grid;
        gap: 4px;
        padding: 14px 14px 4px;
        border: 1px solid rgb(148 163 184 / 0.14);
        border-radius: 10px;
        background: rgb(15 23 42 / 0.42);
      }

      .control-group-title {
        margin: 0;
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #f8fafc;
      }

      .control-group-description {
        margin: 0 0 2px;
        font-size: 0.77rem;
        line-height: 1.45;
        color: #94a3b8;
      }

      .control {
        display: grid;
        gap: 7px;
        padding: 10px 0;
        border-bottom: 1px solid rgb(148 163 184 / 0.18);
      }

      .control label {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-size: 0.85rem;
        color: #cbd5e1;
      }

      .label-main {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }

      .tooltip-indicator {
        display: inline-grid;
        place-items: center;
        width: 1rem;
        height: 1rem;
        border: 1px solid rgb(148 163 184 / 0.45);
        border-radius: 999px;
        color: #94a3b8;
        font-size: 0.72rem;
        line-height: 1;
        cursor: help;
        flex: 0 0 auto;
      }

      .value-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 86px;
        gap: 8px;
        align-items: center;
      }

      input[type="range"] {
        width: 100%;
        accent-color: #22c55e;
      }

      input[type="number"],
      input[type="text"] {
        width: 100%;
        border: 1px solid rgb(148 163 184 / 0.35);
        border-radius: 6px;
        background: #020617;
        color: #f8fafc;
        padding: 7px 8px;
        font: inherit;
      }

      .preview-shell {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 12px;
        min-height: calc(100vh - 40px);
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        color: #94a3b8;
        font-size: 0.9rem;
      }

      .toolbar-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .toolbar-button {
        border: 1px solid rgb(34 197 94 / 0.35);
        border-radius: 999px;
        background: rgb(21 128 61 / 0.16);
        color: #dcfce7;
        padding: 7px 12px;
        font: inherit;
        cursor: pointer;
      }

      .toolbar-button:hover {
        background: rgb(21 128 61 / 0.24);
      }

      #preview {
        display: grid;
        place-items: center;
        min-height: 420px;
        overflow: auto;
        border: 1px solid rgb(148 163 184 / 0.2);
        border-radius: 8px;
        background: #020617;
      }

      #preview svg {
        display: block;
        width: auto;
        height: auto;
        max-width: 100%;
        max-height: 100%;
      }

      @media (max-width: 860px) {
        main {
          grid-template-columns: 1fr;
        }

        #controls {
          max-height: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <aside>
        <h1>Displacement Field</h1>
        <form id="controls" autocomplete="off"></form>
      </aside>
      <section class="preview-shell" aria-label="Generated displacement field">
        <div class="toolbar">
          <span>Source scalar heatmap with vector overlay</span>
          <div class="toolbar-actions">
            <input
              id="import-binary-input"
              type="file"
              accept=".bin,application/octet-stream"
              hidden
            />
            <button id="import-binary" class="toolbar-button" type="button">
              Import binary
            </button>
            <button id="export-binary" class="toolbar-button" type="button">
              Export binary
            </button>
            <span id="status">Preparing</span>
          </div>
        </div>
        <div id="preview"></div>
      </section>
    </main>
    <script type="module" src="/src/client/index.js"></script>
  </body>
</html>
