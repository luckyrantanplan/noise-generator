<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Displacement Field Generator</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #111827;
        color: #e5e7eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #111827;
      }

      main {
        display: grid;
        grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
        gap: 20px;
        min-height: 100vh;
        padding: 20px;
      }

      aside,
      section {
        min-width: 0;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: 0;
      }

      #controls {
        display: grid;
        gap: 12px;
        max-height: calc(100vh - 76px);
        overflow: auto;
        padding-right: 6px;
      }

      .control {
        display: grid;
        gap: 7px;
        padding: 10px 0;
        border-bottom: 1px solid rgb(148 163 184 / 0.18);
      }

      .control label {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-size: 0.85rem;
        color: #cbd5e1;
      }

      .value-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 86px;
        gap: 8px;
        align-items: center;
      }

      input[type="range"] {
        width: 100%;
        accent-color: #22c55e;
      }

      input[type="number"],
      input[type="text"] {
        width: 100%;
        border: 1px solid rgb(148 163 184 / 0.35);
        border-radius: 6px;
        background: #020617;
        color: #f8fafc;
        padding: 7px 8px;
        font: inherit;
      }

      .preview-shell {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 12px;
        min-height: calc(100vh - 40px);
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        color: #94a3b8;
        font-size: 0.9rem;
      }

      #preview {
        display: grid;
        place-items: center;
        min-height: 420px;
        overflow: hidden;
        border: 1px solid rgb(148 163 184 / 0.2);
        border-radius: 8px;
        background: #020617;
      }

      #preview svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      @media (max-width: 860px) {
        main {
          grid-template-columns: 1fr;
        }

        #controls {
          max-height: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <aside>
        <h1>Displacement Field</h1>
        <form id="controls" autocomplete="off"></form>
      </aside>
      <section class="preview-shell" aria-label="Generated displacement field">
        <div class="toolbar">
          <span>Magnitude heatmap with vector overlay</span>
          <span id="status">Preparing</span>
        </div>
        <div id="preview"></div>
      </section>
    </main>
    <script type="module" src="/src/client/index.js"></script>
  </body>
</html>
